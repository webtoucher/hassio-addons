---
name: "Mercury Proxy"
description: "TCP/IP proxy and REST API for Incotex Mercury meters connected via RS485/CAN bus"
version: "0.4.0"
slug: "mercury_proxy"
init: false
arch:
  - aarch64
  - amd64
  - armv7
url: https://github.com/webtoucher/hassio-addons/tree/main/mercury-proxy
startup: services
boot: auto
uart: true
usb: true
ports:
  5053/tcp: 5053
  5054/tcp: 5054
ports_description:
  5053/tcp: "Meter bus proxy for the Configurator"
  5054/tcp: "REST API"
watchdog: "tcp://[HOST]:[PORT:5053]"
options:
  meters:
    - address: 37793503
      port: "/dev/ttyACM0"
  baudrate: 9600
  api: true
  api_token: ""
  log_level: info
  log_console: true
  reconnect_interval: 30
schema:
  meters:
    - address: int
      port: str
  baudrate: int(1200,115200)
  timeout: float(0.1,120)?
  connect_timeout: float(0.1,120)?
  api: bool
  api_token: str?
  log_level: list(debug|info|warning)
  log_console: bool
  reconnect_interval: float(0,3600)
