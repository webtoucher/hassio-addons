---
name: "Mercury Proxy"
description: "TCP/IP proxy and REST API for Incotex Mercury meters connected via RS485/CAN bus"
version: "0.3.0"
slug: "mercury_proxy"
init: false
arch:
  - aarch64
  - amd64
  - armv7
url: https://github.com/webtoucher/hassio-addons/tree/main/mercury-proxy
startup: services
boot: auto
uart: true
usb: true
ports:
  5053/tcp: 5053
  5054/tcp: 5054
ports_description:
  5053/tcp: "Meter bus proxy for the Configurator"
  5054/tcp: "REST API"
options:
  meter_address: 37793503
  meter_port: "/dev/ttyACM0"
  baudrate: 9600
  api: true
  api_token: ""
  log_level: info
  reconnect_interval: 30
schema:
  meter_address: int
  meter_port: str
  baudrate: int(1200,115200)
  api: bool
  api_token: str?
  log_level: list(debug|info|warning)
  reconnect_interval: float(0,3600)
